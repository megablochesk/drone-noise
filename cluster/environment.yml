# The conda environment that produced the stored runs, pinned to its versions (conda env export --no-builds of
# the laptop environment, python 3.12.11, linux-64). Create on the cluster with:
#   conda env create -f cluster/environment.yml
# It holds packages the model does not use; they are kept because pandas and geopandas import their file
# backends (fastparquet, pyogrio, fiona) only when reading, so a trimmed list cannot be checked without a
# cluster install, and identical versions keep the numerical libraries those runs used.
