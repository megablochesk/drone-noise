[pytest]
testpaths = tests
pythonpath = src
markers =
    slow: full-size runs and real-data checks; excluded from the fast suite (run with -m slow)
    published_runner: the published per-step runner over the whole day at 1,250 drones; excluded from the fast and slow suites (run with -m published_runner)
addopts = -m "not slow and not published_runner" -p no:cacheprovider
